{% extends "base.html" %}
{% block content %}
<div class="panel">
  <aside class="rail">
    <div class="rail-title"><div class="eyebrow">Faculty advisor</div><h3>{{ current_user.name }}</h3></div>
    <nav>
      <a href="{{ url_for('faculty.dashboard') }}" class="{{ 'active' if request.endpoint == 'faculty.dashboard' }}">Dashboard</a>
      <div class="divider"></div>
      <div class="eyebrow" style="padding:4px 12px">Advised clubs</div>
      {% for c in advised %}
      <a href="{{ url_for('faculty.club', club_id=c.club_id) }}" class="{{ 'active' if request.view_args.get('club_id') == c.club_id }}">{{ c.name }}</a>
      {% endfor %}
    </nav>
  </aside>
  <div class="min0">{% block panel %}{% endblock %}</div>
</div>
{% endblock %}
